<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
</head>
<body style="margin: 0; padding: 20px 0; background-color: #f8fafc; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;">
  <table align="center" border="0" cellpadding="0" cellspacing="0" width="100%" style="max-width: 600px; margin: 0 auto; background-color: #ffffff; border-radius: 16px; overflow: hidden; box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05);">
    
    <!-- 🌅 ヘッダー -->
    <tr>
      <td style="background: linear-gradient(135deg, #3b82f6 0%, #2563eb 100%); padding: 32px 28px; text-align: left;">
        <p style="margin: 0 0 6px 0; color: #93c5fd; font-size: 12px; font-weight: 700; letter-spacing: 1.5px;"><?= dateStr ?></p>
        <h1 style="margin: 0; color: #ffffff; font-size: 22px; font-weight: 800; letter-spacing: -0.5px;">朝の要約ニュース ☀️</h1>
      </td>
    </tr>

    <!-- ☕ メインコンテンツエリア -->
    <tr>
      <td style="padding: 32px 28px; background-color: #ffffff;">
        <p style="margin: 0 0 24px 0; color: #64748b; font-size: 14px; line-height: 1.5;">
          おはようございます！今日押さえておくべきニュース要約です。
        </p>
        
        <!-- ニュースカード枠（ポッチを無くしてスッキリ配置） -->
        <div style="background-color: #f1f5f9; border-left: 4px solid #3b82f6; border-radius: 0 12px 12px 0; padding: 24px;">
          <?!= formattedSummary ?>
        </div>
      </td>
    </tr>

    <!-- ✉️ フッター -->
    <tr>
      <td style="background-color: #f8fafc; padding: 20px 28px; text-align: center; border-top: 1px solid #e2e8f0;">
        <p style="margin: 0; color: #94a3b8; font-size: 12px;">
          Powered by Gemini API & GAS • Have a great day!
        </p>
      </td>
    </tr>

  </table>
</body>
</html>
